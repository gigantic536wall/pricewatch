name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pricewatch
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PRICEWATCH_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/pricewatch
      PRICEWATCH_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/pricewatch_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Create test database
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE pricewatch_test"
      - name: Migrations apply cleanly
        run: uv run alembic upgrade head && uv run alembic check
      - run: uv run pytest -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the whole stack
        run: docker compose up -d --build --wait db web
      - name: Smoke test
        run: |
          curl -fsS http://localhost:8000/healthz
          curl -fsS http://localhost:8000/ | grep -q "Tracked products"
          curl -fsS http://localhost:8000/shop/ | grep -q "Kaffeewerk"
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - run: docker compose down -v
        if: always()
